[package]
name = "pi-codex-voice"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22.1"
bytes = "1"
cpal = "=0.18.1"
crossbeam-queue = "0.3"
opus = "0.3.1"
rubato = { version = "=5.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = { version = "=0.2.0", default-features = false }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
webrtc = "0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }

# 0.18.1's public hidden-device constructor lives in a private module.
# This exact source copy adds only a macOS Device re-export; see VENDORED.md.
[patch.crates-io]
cpal = { path = "vendor/cpal" }

[profile.release]
strip = true
lto = true
codegen-units = 1
